<template>

    <lightning-card title="Available Scholarships" class="slds-p-around_small">

        <div class="slds-grid slds-gutters slds-wrap">
            <template for:each={scholarships} for:item="sch">
                <div key={sch.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3 slds-p-around_small">
                    <lightning-card>
                        <h3 class="slds-text-heading_small slds-p-bottom_x-small">{sch.Name}</h3>
                        <lightning-button
                            label="View Details"
                            variant="brand"
                            data-id={sch.Id}
                            onclick={viewDetails}>
                        </lightning-button>
                    </lightning-card>
                </div>
            </template>
        </div>

    </lightning-card>

</template>
